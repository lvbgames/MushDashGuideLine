[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[context.production.environment]
  PUBLIC_ANALYTICS_ENDPOINT = "https://lvb-analytics.lvb-analytics-worker.workers.dev/hit"

[[edge_functions]]
  path = "/"
  function = "locale-redirect"

[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:one/index.html"
  to = "/:one/"
  status = 301
  force = true

[[redirects]]
  from = "/:one/:two/index.html"
  to = "/:one/:two/"
  status = 301
  force = true

[[redirects]]
  from = "/:one/:two/:three/index.html"
  to = "/:one/:two/:three/"
  status = 301
  force = true
