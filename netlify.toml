[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[context.production.environment]
  PUBLIC_ANALYTICS_ENDPOINT = "https://lvb-analytics.lvb-analytics-worker.workers.dev/hit"

[[edge_functions]]
  path = "/"
  function = "locale-redirect"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://shared.akamai.steamstatic.com; font-src 'self'; connect-src 'self' https://lvb-analytics.lvb-analytics-worker.workers.dev; frame-src https://www.google.com https://www.youtube-nocookie.com; media-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'self'"

[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:one/index.html"
  to = "/:one/"
  status = 301
  force = true

[[redirects]]
  from = "/:one/:two/index.html"
  to = "/:one/:two/"
  status = 301
  force = true

[[redirects]]
  from = "/:one/:two/:three/index.html"
  to = "/:one/:two/:three/"
  status = 301
  force = true
